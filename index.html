<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Letterboxd / TMDB Duel - TikTok Edition</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      font-family: 'Montserrat', sans-serif;
    }

    body {
      background-color: #14181c;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 15px;
    }

    .main-wrapper {
      display: flex;
      flex-direction: row;
      align-items: stretch;
      justify-content: center;
      gap: 20px;
      width: 100%;
      max-width: 780px;
      height: 88vh;
      min-height: 620px;
      max-height: 850px;
    }

    /* Panneau Leaderboard */
    .leaderboard-panel {
      width: 260px;
      background: #181f25;
      border-radius: 18px;
      border: 2px solid #2c3440;
      padding: 15px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
    }

    .leaderboard-title {
      font-size: 1rem;
      font-weight: 900;
      color: #ff8000;
      text-transform: uppercase;
      letter-spacing: 1px;
      text-align: center;
      margin-bottom: 12px;
    }

    .leaderboard-list {
      list-style: none;
      overflow-y: auto;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .leaderboard-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 10px;
      background: rgba(44, 52, 64, 0.4);
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 700;
    }

    .leaderboard-item.top-1 { border-left: 4px solid #ffd700; background: rgba(255, 215, 0, 0.1); }
    .leaderboard-item.top-2 { border-left: 4px solid #c0c0c0; }
    .leaderboard-item.top-3 { border-left: 4px solid #cd7f32; }

    .rank-name {
      display: flex;
      align-items: center;
      gap: 6px;
      max-width: 150px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .rank-num {
      color: #9ab;
      font-size: 0.75rem;
      width: 16px;
    }

    .score-badge-lb {
      background: #00e054;
      color: #000;
      font-weight: 900;
      padding: 2px 7px;
      border-radius: 10px;
      font-size: 0.75rem;
    }

    /* Cadre de jeu vertical (TikTok 9:16) */
    .game-container {
      width: 100%;
      max-width: 400px;
      background: #181f25;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
      border-radius: 18px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.9);
      border: 2px solid #2c3440;
    }

    .timer-bar-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 4px;
      background: rgba(255, 255, 255, 0.1);
      z-index: 15;
    }

    .timer-bar {
      height: 100%;
      width: 100%;
      background: #ff4757;
      transition: width 1s linear;
    }

    .header {
      position: absolute;
      top: 12px;
      left: 0;
      right: 0;
      z-index: 10;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 15px;
      font-size: 0.8rem;
      font-weight: 900;
      text-transform: uppercase;
      text-shadow: 0 2px 5px rgba(0,0,0,0.9);
    }

    .timer-badge {
      background: #ff4757;
      color: #fff;
      padding: 4px 10px;
      border-radius: 16px;
      font-weight: 900;
    }

    .streak-badge {
      background: #ff8000;
      color: #000;
      padding: 4px 10px;
      border-radius: 16px;
    }

    .card {
      flex: 1;
      position: relative;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-color: #242c35;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 20px;
      transition: background 0.3s ease-in-out;
    }

    .overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(20,24,28,0.95) 25%, rgba(20,24,28,0.35) 100%);
      z-index: 1;
    }

    .card-content {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      width: 100%;
    }

    .title {
      font-size: 1.25rem;
      font-weight: 900;
      margin-bottom: 2px;
      text-shadow: 0 2px 4px rgba(0,0,0,0.8);
      max-width: 90%;
    }

    .year {
      font-size: 0.8rem;
      color: #9ab;
      margin-bottom: 6px;
      font-weight: 700;
    }

    .rating-box {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 1.8rem;
      font-weight: 900;
      color: #00e054;
    }

    .rating-box span {
      font-size: 1.4rem;
      color: #fff;
    }

    .vs-divider {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 42px;
      height: 42px;
      background: #fff;
      color: #14181c;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 1rem;
      z-index: 5;
      box-shadow: 0 0 15px rgba(0,0,0,0.8);
      border: 3px solid #14181c;
    }

    .actions {
      display: flex;
      flex-direction: column;
      gap: 6px;
      width: 100%;
      max-width: 180px;
      margin-top: 6px;
    }

    .btn {
      padding: 10px;
      border: none;
      border-radius: 25px;
      font-weight: 900;
      font-size: 0.85rem;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .btn-higher { background-color: #00e054; color: #000; }
    .btn-lower { background-color: #ff8000; color: #000; }

    /* Game Over */
    .game-over-screen {
      position: absolute;
      inset: 0;
      background: rgba(20,24,28,0.96);
      z-index: 20;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      text-align: center;
    }

    .game-over-screen h2 {
      font-size: 2.2rem;
      color: #ff4757;
      margin-bottom: 4px;
      font-weight: 900;
    }

    .game-over-reason {
      font-size: 0.85rem;
      color: #ff8000;
      margin-bottom: 10px;
      font-weight: 700;
    }

    .final-score {
      font-size: 1rem;
      margin-bottom: 15
