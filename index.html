<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Letterboxd / TMDB Duel - TikTok Edition</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      font-family: 'Montserrat', sans-serif;
    }

    body {
      background-color: #14181c;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 15px;
      gap: 25px;
    }

    .main-wrapper {
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: center;
      gap: 20px;
      width: 100%;
      max-width: 820px;
      height: 92vh;
      max-height: 850px;
    }

    /* Panneau Leaderboard à gauche */
    .leaderboard-panel {
      width: 280px;
      height: 100%;
      background: #181f25;
      border-radius: 20px;
      border: 2px solid #2c3440;
      padding: 20px 15px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
    }

    .leaderboard-title {
      font-size: 1.1rem;
      font-weight: 900;
      color: #ff8000;
      text-transform: uppercase;
      letter-spacing: 1px;
      text-align: center;
      margin-bottom: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .leaderboard-list {
      list-style: none;
      overflow-y: auto;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .leaderboard-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 12px;
      background: rgba(44, 52, 64, 0.4);
      border-radius: 10px;
      font-size: 0.85rem;
      font-weight: 700;
    }

    .leaderboard-item.top-1 { border-left: 4px solid #ffd700; background: rgba(255, 215, 0, 0.1); }
    .leaderboard-item.top-2 { border-left: 4px solid #c0c0c0; }
    .leaderboard-item.top-3 { border-left: 4px solid #cd7f32; }

    .rank-name {
      display: flex;
      align-items: center;
      gap: 8px;
      max-width: 170px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .rank-num {
      color: #9ab;
      font-size: 0.75rem;
      width: 18px;
    }

    .score-badge-lb {
      background: #00e054;
      color: #000;
      font-weight: 900;
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 0.8rem;
    }

    /* Cadre de jeu vertical (TikTok) */
    .game-container {
      width: 100%;
      max-width: 420px;
      height: 100%;
      background: #181f25;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.9);
      border: 2px solid #2c3440;
    }

    .header {
      position: absolute;
      top: 12px;
      left: 0;
      right: 0;
      z-index: 10;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 16px;
      font-size: 0.85rem;
      font-weight: 900;
      text-transform: uppercase;
      text-shadow: 0 2px 5px rgba(0,0,0,0.9);
    }

    .timer-badge {
      background: #ff4757;
      color: #fff;
      padding: 5px 12px;
      border-radius: 20px;
      font-weight: 900;
      box-shadow: 0 0 8px rgba(255, 71, 87, 0.6);
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .streak-badge {
      background: #ff8000;
      color: #000;
      padding: 5px 12px;
      border-radius: 20px;
    }

    .timer-bar-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 5px;
      background: rgba(255, 255, 255, 0.1);
      z-index: 15;
    }

    .timer-bar {
      height: 100%;
      width: 100%;
      background: #ff4757;
      transition: width 1s linear;
    }

    .card {
      flex: 1;
      position: relative;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 25px;
      transition: background 0.3s ease-in-out;
    }

    .overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(20,24,28,0.95) 25%, rgba(20,24,28,0.4) 100%);
      z-index: 1;
    }

    .card-content {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      width: 100%;
    }

    .title {
      font-size: 1.35rem;
      font-weight: 900;
      margin-bottom: 4px;
      text-shadow: 0 2px 4px rgba(0,0,0,0.8);
      max-width: 90%;
    }

    .year {
      font-size: 0.85rem;
      color: #9ab;
      margin-bottom: 8px;
      font-weight: 700;
    }

    .rating-box {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 2rem;
      font-weight: 900;
      color: #00e054;
    }

    .rating-box span {
      font-size: 1.5rem;
      color: #fff;
    }

      position: absolute
