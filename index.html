<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Letterboxd / TMDB Duel - TikTok Edition</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      font-family: 'Montserrat', sans-serif;
    }

    body {
      background-color: #14181c;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 10px;
    }

    .game-container {
      width: 100%;
      max-width: 420px;
      height: 92vh;
      max-height: 850px;
      background: #181f25;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.9);
      border: 2px solid #2c3440;
    }

    .header {
      position: absolute;
      top: 15px;
      left: 0;
      right: 0;
      z-index: 10;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 20px;
      font-size: 0.85rem;
      font-weight: 900;
      text-transform: uppercase;
      text-shadow: 0 2px 5px rgba(0,0,0,0.9);
    }

    .streak-badge {
      background: #ff8000;
      color: #000;
      padding: 5px 12px;
      border-radius: 20px;
    }

    .card {
      flex: 1;
      position: relative;
      background-size: cover;
      background-position: center;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 25px;
      transition: background-image 0.4s ease-in-out;
    }

    .overlay {
