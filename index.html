<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Letterboxd / TMDB Duel - TikTok Edition</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      font-family: 'Montserrat', sans-serif;
    }

    body {
      background-color: #14181c;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px 10px;
    }

    .main-wrapper {
      display: flex;
      flex-direction: row;
      justify-content: center;
      gap: 20px;
      width: 100%;
      max-width: 760px;
      height: 720px;
    }

    /* Panneau Leaderboard */
    .leaderboard-panel {
      width: 260px;
      height: 100%;
      background: #181f25;
      border-radius: 18px;
      border: 2px solid #2c3440;
      padding: 15px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
    }

    .leaderboard-title {
      font-size: 1rem;
      font-weight: 900;
      color: #ff8000;
      text-transform: uppercase;
      letter-spacing: 1px;
      text-align: center;
      margin-bottom: 12px;
    }

    .leaderboard-list {
      list-style: none;
      overflow-y: auto;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .leaderboard-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 10px;
      background: rgba(44, 52, 64, 0.4);
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 700;
    }

    .leaderboard-item.top-1 { border-left: 4px solid #ffd700; background: rgba(255, 215, 0, 0.1); }
    .leaderboard-item.top-2 { border-left: 4px solid #c0c0c0; }
    .leaderboard-item.top-3 { border-left: 4px solid #cd7f32; }

    .rank-name {
      display: flex;
      align-items: center;
      gap: 6px;
      max-width: 150px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .rank-num {
      color: #9ab;
      font-size: 0.75rem;
      width: 16px;
    }

    .score-badge-lb {
      background: #00e054;
      color: #000;
      font-weight: 900;
      padding: 2px 7px;
      border-radius: 10px;
      font-size: 0.75rem;
    }

    /* Cadre de jeu vertical (TikTok 9:16) */
    .game-container {
      width: 100%;
      max-width: 400px;
      height: 100%;
      background: #181f25;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
      border-radius: 18px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.9);
      border: 2px solid #2c3440;
    }

    .timer-bar-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 5px;
      background: rgba(255, 255, 255, 0.1);
      z-index: 15;
    }

    .timer-bar {
      height: 100%;
      width: 100%;
      background: #ff4757;
      transition: width 1s linear;
    }

    .header {
      position: absolute;
      top: 12px;
      left: 0;
      right: 0;
      z-index: 10;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 15px;
      font-size: 0.8rem;
      font-weight: 900;
      text-transform: uppercase;
      text-shadow: 0 2px 5px rgba(0,0,0,0.9);
    }

    .timer-badge {
      background: #ff4757;
      color: #fff;
      padding: 4px 10px;
      border-radius: 16px;
      font-weight: 900;
    }

    .streak-badge {
      background: #ff8000;
      color: #000;
      padding: 4px 10px;
      border-radius: 16px;
    }

    .card {
      flex: 1;
      position: relative;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-color: #202830;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 20px;
      transition: background 0.3s ease-in-out;
    }

    .overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(20,24,28,0.95) 25%, rgba(20,24,28,0.35) 100%);
      z-index: 1;
    }

    .card-content {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      width: 100%;
    }

    .title {
      font-size: 1.25rem;
      font-weight: 900;
      margin-bottom: 2px;
      text-shadow: 0 2px 4px rgba(0,0,0,0.8);
      max-width: 90%;
    }

    .year {
      font-size: 0.8rem;
      color: #9ab;
      margin-bottom: 6px;
      font-weight: 700;
    }

    .rating-box {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 1.8rem;
      font-weight: 900;
      color: #00e054;
    }

    .rating-box span {
      font-size: 1.4rem;
      color: #fff;
    }

    .vs-divider {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 42px;
      height: 42px;
      background: #fff;
      color: #14181c;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 1rem;
      z-index: 5;
      box-shadow: 0 0 15px rgba(0,0,0,0.8);
      border: 3px solid #14181c;
    }

    .actions {
      display: flex;
      flex-direction: column;
      gap: 6px;
      width: 100%;
      max-width: 180px;
      margin-top: 6px;
    }

    .btn {
      padding: 10px;
      border: none;
      border-radius: 25px;
      font-weight: 900;
      font-size: 0.85rem;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .btn-higher { background-color: #00e054; color: #000; }
    .btn-lower { background-color: #ff8000; color: #000; }

    /* Game Over */
    .game-over-screen {
      position: absolute;
      inset: 0;
      background: rgba(20,24,28,0.96);
      z-index: 20;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      text-align: center;
    }

    .game-over-screen h2 {
      font-size: 2.2rem;
      color: #ff4757;
      margin-bottom: 4px;
      font-weight: 900;
    }

    .game-over-reason {
      font-size: 0.85rem;
      color: #ff8000;
      margin-bottom: 10px;
      font-weight: 700;
    }

    .final-score {
      font-size: 1rem;
      margin-bottom: 15px;
      color: #9ab;
    }

    .final-score b {
      color: #00e054;
      font-size: 2rem;
      display: block;
      margin-top: 4px;
    }

    .name-input-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: 100%;
      max-width: 240px;
      margin-bottom: 12px;
    }

    .name-input {
      padding: 10px;
      border-radius: 10px;
      border: 2px solid #2c3440;
      background: #14181c;
      color: #fff;
      text-align: center;
      font-weight: 700;
      font-size: 0.9rem;
      outline: none;
    }

    .btn-submit-score {
      background: #00e054;
      color: #000;
      padding: 10px;
    }

    .btn-restart {
      background: #40bcf4;
      color: #000;
      padding: 10px 24px;
    }

    @media (max-width: 768px) {
      .main-wrapper {
        flex-direction: column-reverse;
        height: auto;
      }
      .leaderboard-panel {
        width: 100%;
        max-width: 400px;
        height: 200px;
      }
      .game-container {
        height: 600px;
      }
    }
  </style>
</head>
<body>

  <div class="main-wrapper">
    <div class="leaderboard-panel">
      <div class="leaderboard-title">🏆 Top 10 Records</div>
      <ul class="leaderboard-list" id="leaderboardList"></ul>
    </div>

    <div class="game-container">
      <div class="timer-bar-container">
        <div class="timer-bar" id="timerBar"></div>
      </div>

      <div class="header">
        <span class="timer-badge">⏱️ <span id="timerText">30</span>s</span>
        <span class="streak-badge">Score : <span id="score">0</span></span>
      </div>

      <div class="card" id="card-top">
        <div class="overlay"></div>
        <div class="card-content">
          <div class="title" id="title-top">Inception</div>
          <div class="year" id="year-top">2010</div>
          <div class="rating-box">
            ★ <span id="rating-top">4.4</span>
          </div>
        </div>
      </div>

      <div class="vs-divider">VS</div>

      <div class="card" id="card-bottom">
        <div class="overlay"></div>
        <div class="card-content">
          <div class="title" id="title-bottom">Parasite</div>
          <div class="year" id="year-bottom">2019</div>
          
          <div class="actions" id="actions">
            <button class="btn btn-higher" onclick="makeGuess('higher')">▲ PLUS HAUT</button>
            <button class="btn btn-lower" onclick="makeGuess('lower')">▼ PLUS BAS</button>
          </div>

          <div class="rating-box" id="rating-bottom-box" style="display: none;">
            ★ <span id="rating-bottom">?.?</span>
          </div>
        </div>
      </div>

      <div class="game-over-screen" id="gameOverScreen">
        <h2>PERDU !</h2>
        <div class="game-over-reason" id="gameOverReason">Mauvaise réponse</div>
        <p class="final-score">Score final : <b id="finalScoreText">0</b></p>
        
        <div class="name-input-group" id="saveScoreForm">
          <input type="text" id="playerName" class="name-input" placeholder="Ton pseudo / Prénom" maxlength="15">
          <button class="btn btn-submit-score" onclick="savePlayerScore()">Enregistrer</button>
        </div>

        <button class="btn btn-restart" id="btnRestart" onclick="restartGame()">Rejouer</button>
      </div>
    </div>
  </div>

  <script>
    const TMDB_API_KEY = "12167271b4a50458357335b8a53e2e5a";
    const IMG_BASE_URL = "https://image.tmdb.org/t/p/w780";
    const ROUND_TIME = 30;

    const fallbackMovies = [
      { title: "Inception", year: "2010", rating: 4.4, img: "https://image.tmdb.org/t/p/w780/8ZTVqvKDQ8emSGUEMjsS4yHAwrp.jpg" },
      { title: "Parasite", year: "2019", rating: 4.5, img: "https://image.tmdb.org/t/p/w780/hiKmpZMGZsrkA3cdce8a7Dpos1j.jpg" },
      { title: "Interstellar", year: "2014", rating: 4.4, img: "https://image.tmdb.org/t/p/w780/xJHokMbljvjADYdit5fK5VQsXEG.jpg" },
      { title: "Pulp Fiction", year: "1994", rating: 4.3, img: "https://image.tmdb.org/t/p/w780/suaEOtk1N1sgg2MTM7oZd2cfVp3.jpg" },
      { title: "Fight Club", year: "1999", rating: 4.3, img: "https://image.tmdb.org/t/p/w780/hZkgoQYus5vegHoetLkCJzb17zJ.jpg" },
      { title: "Oppenheimer", year: "2023", rating: 4.2, img: "https://image.tmdb.org/t/p/w780/fm6KqXpk3M2HVveHwCrBSSBaO0V.jpg" }
    ];

    let moviePool = [];
    let currentScore = 0;
    let movieTop = null;
    let movieBottom = null;
    let isProcessing = false;
    let currentPage = 1;
    let timeLeft = ROUND_TIME;
    let timerInterval = null;

    function getLeaderboard() {
      const stored = localStorage.getItem('cine_duel_leaderboard');
      if (stored) return JSON.parse(stored);
      return [
        { name: "Cinéphile99", score: 14 },
        { name: "LetterboxdKing", score: 11 },
        { name: "PopcornFan", score: 8 },
        { name: "NolanStan", score: 6 },
        { name: "CinéAddict", score: 4 }
      ];
    }

    function renderLeaderboard() {
      const list = document.getElementById('leaderboardList');
      const leaderboard = getLeaderboard();
      list.innerHTML = '';

      leaderboard.slice(0, 10).forEach((item, index) => {
        const li = document.createElement('li');
        li.className = `leaderboard-item top-${index + 1}`;
        li.innerHTML = `
          <div class="rank-name">
            <span class="rank-num">#${index + 1}</span>
            <span>${item.name}</span>
          </div>
          <span class="score-badge-lb">${item.score} pts</span>
        `;
        list.appendChild(li);
      });
    }

    function savePlayerScore() {
      const nameInput = document.getElementById('playerName');
      const name = nameInput.value.trim() || "Anonyme";
      const leaderboard = getLeaderboard();

      leaderboard.push({ name: name, score: currentScore });
      leaderboard.sort((a, b) => b.score - a.score);

      localStorage.setItem('cine_duel_leaderboard', JSON.stringify(leaderboard.slice(0, 10)));
      renderLeaderboard();

      document.getElementById('saveScoreForm').style.display = 'none';
    }

    function startTimer() {
      clearInterval(timerInterval);
      timeLeft = ROUND_TIME;
      updateTimerDisplay();

      timerInterval = setInterval(() => {
        timeLeft--;
        updateTimerDisplay();

        if (timeLeft <= 0) {
          clearInterval(timerInterval);
          handleTimeOut();
        }
      }, 1000);
    }

    function updateTimerDisplay() {
      document.getElementById('timerText').innerText = timeLeft;
      const percentage = (timeLeft / ROUND_TIME) * 100;
      document.getElementById('timerBar').style.width = `${percentage}%`;
    }

    function handleTimeOut() {
      if (isProcessing) return;
      isProcessing = true;
      document.getElementById('actions').style.display = 'none';
      document.getElementById('gameOverReason').innerText = "⏱️ Temps écoulé (30s max !)";
      document.getElementById('finalScoreText').innerText = currentScore;
      document.getElementById('saveScoreForm').style.display = currentScore > 0 ? 'flex' : 'none';
      document.getElementById('gameOverScreen').style.display = 'flex';
    }

    async function fetchMovies(page = 1) {
      try {
        const url = `https://api.themoviedb.org/3/discover/movie?api_key=${TMDB_API_KEY}&language=fr-FR&sort_by=popularity.desc&include_adult=false&vote_count.gte=100&page=${page}`;
        const res = await fetch(url);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        if (!data.results || data.results.length === 0) return [];

        return data.results
          .filter(m => (m.backdrop_path || m.poster_path))
          .map(m => ({
            title: m.title || m.original_title,
            year: m.release_date ? m.release_date.split('-')[0] : '',
            rating: parseFloat((m.vote_average / 2).toFixed(1)),
            img: `${IMG_BASE_URL}${m.backdrop_path || m.poster_path}`
          }));
      } catch (err) {
        return [...fallbackMovies];
      }
    }

    function updateUI() {
      document.getElementById('score').innerText = currentScore;
      
      const cardTop = document.getElementById('card-top');
      if (movieTop.img) cardTop.style.backgroundImage = `url('${movieTop.img}')`;
      document.getElementById('title-top').innerText = movieTop.title;
      document.getElementById('year-top').innerText = movieTop.year;
      document.getElementById('rating-top').innerText = movieTop.rating.toFixed(1);

      const cardBottom = document.getElementById('card-bottom');
      if (movieBottom.img) cardBottom.style.backgroundImage = `url('${movieBottom.img}')`;
      document.getElementById('title-bottom').innerText = movieBottom.title;
      document.getElementById('year-bottom').innerText = movieBottom.year;
      
      document.getElementById('actions').style.display = 'flex';
      document.getElementById('rating-bottom-box').style.display = 'none';
      document.getElementById('gameOverScreen').style.display = 'none';
      isProcessing = false;
      startTimer();
    }

    async function initGame() {
      renderLeaderboard();
      moviePool = [...fallbackMovies].sort(() => Math.random() - 0.5);
      movieTop = moviePool.pop();
      movieBottom = moviePool.pop();
      currentScore = 0;
      updateUI();

      currentPage = Math.floor(Math.random() * 5) + 1;
      const onlineMovies = await fetchMovies(currentPage);
      if (onlineMovies.length > 0) {
        moviePool = [...onlineMovies].sort(() => Math.random() - 0.5);
      }
    }

    async function makeGuess(choice) {
      if (isProcessing) return;
      isProcessing = true;
      clearInterval(timerInterval);

      const isHigher = movieBottom.rating >= movieTop.rating;
      const won = (choice === 'higher' && isHigher) || (choice === 'lower' && !isHigher);

      document.getElementById('actions').style.display = 'none';
      document.getElementById('rating-bottom').innerText = movieBottom.rating.toFixed(1);
      document.getElementById('rating-bottom-box').style.display = 'flex';

      setTimeout(async () => {
        if (won) {
          currentScore++;
          movieTop = movieBottom;

          if (moviePool.length < 2) {
            currentPage++;
            const newMovies = await fetchMovies(currentPage);
            moviePool = [...moviePool, ...newMovies].sort(() => Math.random() - 0.5);
          }

          movieBottom = moviePool.pop() || fallbackMovies[Math.floor(Math.random() * fallbackMovies.length)];
          updateUI();
        } else {
          document.getElementById('gameOverReason').innerText = "Mauvaise réponse !";
          document.getElementById('finalScoreText').innerText = currentScore;
          document.getElementById('saveScoreForm').style.display = currentScore > 0 ? 'flex' : 'none';
          document.getElementById('gameOverScreen').style.display = 'flex';
        }
      }, 1100);
    }

    function restartGame() {
      initGame();
    }

    initGame();
  </script>
</body>
</html>
