<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Letterboxd / TMDB Duel - TikTok Edition</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      font-family: 'Montserrat', sans-serif;
    }

    body {
      background-color: #14181c;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 10px;
    }

    .game-container {
      width: 100%;
      max-width: 420px;
      height: 92vh;
      max-height: 850px;
      background: #181f25;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.9);
      border: 2px solid #2c3440;
    }

    .header {
      position: absolute;
      top: 15px;
      left: 0;
      right: 0;
      z-index: 10;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 20px;
      font-size: 0.85rem;
      font-weight: 900;
      text-transform: uppercase;
      text-shadow: 0 2px 5px rgba(0,0,0,0.9);
    }

    .streak-badge {
      background: #ff8000;
      color: #000;
      padding: 5px 12px;
      border-radius: 20px;
    }

    .card {
      flex: 1;
      position: relative;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 25px;
      transition: background 0.3s ease-in-out;
    }

    .overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(20,24,28,0.95) 25%, rgba(20,24,28,0.4) 100%);
      z-index: 1;
    }

    .card-content {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      width: 100%;
    }

    .title {
      font-size: 1.4rem;
      font-weight: 900;
      margin-bottom: 4px;
      text-shadow: 0 2px 4px rgba(0,0,0,0.8);
      max-width: 90%;
    }

    .year {
      font-size: 0.85rem;
      color: #9ab;
      margin-bottom: 10px;
      font-weight: 700;
    }

    .rating-box {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 2rem;
      font-weight: 900;
      color: #00e054;
    }

    .rating-box span {
      font-size: 1.5rem;
      color: #fff;
    }

    .vs-divider {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 48px;
      height: 48px;
      background: #fff;
      color: #14181c;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 1.1rem;
      z-index: 5;
      box-shadow: 0 0 15px rgba(0,0,0,0.8);
      border: 3px solid #14181c;
    }

    .actions {
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: 100%;
      max-width: 200px;
      margin-top: 10px;
    }

    .btn {
      padding: 12px;
      border: none;
      border-radius: 30px;
      font-weight: 900;
      font-size: 0.95rem;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .btn-higher { background-color: #00e054; color: #000; }
    .btn-lower { background-color: #ff8000; color: #000; }

    .game-over-screen {
      position: absolute;
      inset: 0;
      background: rgba(20,24,28,0.96);
      z-index: 20;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      text-align: center;
    }

    .game-over-screen h2 {
      font-size: 2.5rem;
      color: #ff4757;
      margin-bottom: 10px;
      font-weight: 900;
    }

    .final-score {
      font-size: 1.2rem;
      margin-bottom: 25px;
      color: #9ab;
    }

    .final-score b {
      color: #00e054;
      font-size: 2rem;
      display: block;
      margin-top: 8px;
    }

    .btn-restart {
      background: #40bcf4;
      color: #000;
      padding: 14px 32px;
    }

    .loading {
      position: absolute;
      inset: 0;
      background: #14181c;
      z-index: 30;
      display: flex;
      justify-content: center;
      align-items: center;
      font-weight: 900;
      font-size: 1.1rem;
      color: #00e054;
    }
  </style>
</head>
<body>

  <div class="game-container">
    <div id="loader" class="loading">CHARGEMENT...</div>

    <div class="header">
      <span>Ciné Duel</span>
      <span class="streak-badge">Score : <span id="score">0</span></span>
    </div>

    <div class="card" id="card-top">
      <div class="overlay"></div>
      <div class="card-content">
        <div class="title" id="title-top">...</div>
        <div class="year" id="year-top">....</div>
        <div class="rating-box">
          ★ <span id="rating-top">0.0</span>
        </div>
      </div>
    </div>

    <div class="vs-divider">VS</div>

    <div class="card" id="card-bottom">
      <div class="overlay"></div>
      <div class="card-content">
        <div class="title" id="title-bottom">...</div>
        <div class="year" id="year-bottom">....</div>
        
        <div class="actions" id="actions">
          <button class="btn btn-higher" onclick="makeGuess('higher')">▲ PLUS HAUT</button>
          <button class="btn btn-lower" onclick="makeGuess('lower')">▼ PLUS BAS</button>
        </div>

        <div class="rating-box" id="rating-bottom-box" style="display: none;">
          ★ <span id="rating-bottom">?.?</span>
        </div>
      </div>
    </div>

    <div class="game-over-screen" id="gameOverScreen">
      <h2>PERDU !</h2>
      <p class="final-score">Score final : <b id="finalScoreText">0</b></p>
      <button class="btn btn-restart" onclick="restartGame()">Rejouer</button>
    </div>
  </div>

  <script>
    const TMDB_API_KEY = "12167271b4a50458357335b8a53e2e5a";
    const IMG_BASE_URL = "https://image.tmdb.org/t/p/w780";

    // Base de secours immédiate en cas de lenteur réseau
    const fallbackMovies = [
      { title: "Inception", year: "2010", rating: 4.4, img: "https://image.tmdb.org/t/p/w780/8ZTVqvKDQ8emSGUEMjsS4yHAwrp.jpg" },
      { title: "Parasite", year: "2019", rating: 4.5, img: "https://image.tmdb.org/t/p/w780/hiKmpZMGZsrkA3cdce8a7Dpos1j.jpg" },
      { title: "Interstellar", year: "2014", rating: 4.4, img: "https://image.tmdb.org/t/p/w780/xJHokMbljvjADYdit5fK5VQsXEG.jpg" },
      { title: "Pulp Fiction", year: "1994", rating: 4.3, img: "https://image.tmdb.org/t/p/w780/suaEOtk1N1sgg2MTM7oZd2cfVp3.jpg" },
      { title: "Fight Club", year: "1999", rating: 4.3, img: "https://image.tmdb.org/t/p/w780/hZkgoQYus5vegHoetLkCJzb17zJ.jpg" },
      { title: "Oppenheimer", year: "2023", rating: 4.2, img: "https://image.tmdb.org/t/p/w780/fm6KqXpk3M2HVveHwCrBSSBaO0V.jpg" }
    ];

    let moviePool = [];
    let currentScore = 0;
    let movieTop = null;
    let movieBottom = null;
    let isProcessing = false;
    let currentPage = 1;

    async function fetchMovies(page = 1) {
      try {
        const url = `https://api.themoviedb.org/3/discover/movie?api_key=${TMDB_API_KEY}&language=fr-FR&sort_by=popularity.desc&include_adult=false&vote_count.gte=100&page=${page}`;
        const res = await fetch(url);
        
        if (!res.ok) throw new Error(`HTTP Error: ${res.status}`);
        
        const data = await res.json();
        if (!data.results || data.results.length === 0) return [];

        return data.results
          .filter(m => (m.backdrop_path || m.poster_path))
          .map(m => ({
            title: m.title || m.original_title,
            year: m.release_date ? m.release_date.split('-')[0] : 'N/A',
            rating: parseFloat((m.vote_average / 2).toFixed(1)),
            img: `${IMG_BASE_URL}${m.backdrop_path || m.poster_path}`
          }));
      } catch (err) {
        console.warn("API TMDB non joignable, chargement local de secours :", err);
        return [...fallbackMovies];
      }
    }

    async function initGame() {
      const loader = document.getElementById('loader');
      loader.style.display = 'flex';

      currentPage = Math.floor(Math.random() * 6) + 1;
      moviePool = await fetchMovies(currentPage);

      if (moviePool.length < 2) {
        moviePool = [...fallbackMovies];
      }

      moviePool.sort(() => Math.random() - 0.5);
      movieTop = moviePool.pop();
      movieBottom = moviePool.pop();
      currentScore = 0;

      loader.style.display = 'none';
      updateUI();
    }

    function updateUI() {
      document.getElementById('score').innerText = currentScore;
      
      const cardTop = document.getElementById('card-top');
      cardTop.style.backgroundImage = `url('${movieTop.img}')`;
      document.getElementById('title-top').innerText = movieTop.title;
      document.getElementById('year-top').innerText = movieTop.year;
      document.getElementById('rating-top').innerText = movieTop.rating.toFixed(1);

      const cardBottom = document.getElementById('card-bottom');
      cardBottom.style.backgroundImage = `url('${movieBottom.img}')`;
      document.getElementById('title-bottom').innerText = movieBottom.title;
      document.getElementById('year-bottom').innerText = movieBottom.year;
      
      document.getElementById('actions').style.display = 'flex';
      document.getElementById('rating-bottom-box').style.display = 'none';
      document.getElementById('gameOverScreen').style.display = 'none';
      isProcessing = false;
    }

    async function makeGuess(choice) {
      if (isProcessing) return;
      isProcessing = true;

      const isHigher = movieBottom.rating >= movieTop.rating;
      const won = (choice === 'higher' && isHigher) || (choice === 'lower' && !isHigher);

      document.getElementById('actions').style.display = 'none';
      document.getElementById('rating-bottom').innerText = movieBottom.rating.toFixed(1);
      document.getElementById('rating-bottom-box').style.display = 'flex';

      setTimeout(async () => {
        if (won) {
          currentScore++;
          movieTop = movieBottom;

          if (moviePool.length < 2) {
            currentPage++;
            const newMovies = await fetchMovies(currentPage);
            moviePool = [...moviePool, ...newMovies].sort(() => Math.random() - 0.5);
          }

          movieBottom = moviePool.pop() || fallbackMovies[Math.floor(Math.random() * fallbackMovies.length)];
          updateUI();
        } else {
          document.getElementById('finalScoreText').innerText = currentScore;
          document.getElementById('gameOverScreen').style.display = 'flex';
        }
      }, 1100);
    }

    function restartGame() {
      initGame();
    }

    window.addEventListener('DOMContentLoaded', initGame);
  </script>
</body>
</html>
