<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Letterboxd Duel - TikTok Game</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --lb-green: #00e054;
      --lb-orange: #ff8000;
      --lb-blue: #40bcf4;
      --lb-dark: #14181c;
      --lb-card: #202830;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      font-family: 'Montserrat', sans-serif;
    }

    body {
      background-color: var(--lb-dark);
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    /* Ratio vertical TikTok 9:16 */
    .game-container {
      width: 100%;
      max-width: 420px;
      height: 90vh;
      max-height: 850px;
      background: #181f25;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
      border-radius: 18px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
      border: 2px solid #2c3440;
    }

    .header {
      position: absolute;
      top: 15px;
      left: 0;
      right: 0;
      z-index: 10;
      display: flex;
      justify-content: space-between;
      padding: 0 20px;
      font-size: 0.9rem;
      font-weight: 700;
      text-transform: uppercase;
      text-shadow: 0 2px 4px rgba(0,0,0,0.8);
    }

    .streak-badge {
      background: var(--lb-orange);
      padding: 4px 10px;
      border-radius: 20px;
    }

    /* Cartes des films */
    .card {
      flex: 1;
      position: relative;
      background-size: cover;
      background-position: center;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 25px;
      transition: all 0.3s ease;
    }

    .overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(20,24,28,0.95) 20%, rgba(20,24,28,0.4) 100%);
      z-index: 1;
    }

    .card-content {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .title {
      font-size: 1.5rem;
      font-weight: 900;
      margin-bottom: 5px;
      text-shadow: 0 2px 4px rgba(0,0,0,0.8);
    }

    .year {
      font-size: 0.85rem;
      color: #9ab;
      margin-bottom: 12px;
    }

    .rating-box {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 1.8rem;
      font-weight: 900;
      color: var(--lb-green);
    }

    .rating-box span {
      font-size: 1.2rem;
      color: #fff;
    }

    /* Séparateur central VS */
    .vs-divider {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 50px;
      height: 50px;
      background: #fff;
      color: var(--lb-dark);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 1.1rem;
      z-index: 5;
      box-shadow: 0 0 15px rgba(0,0,0,0.6);
      border: 3px solid var(--lb-dark);
    }

    /* Boutons de choix */
    .actions {
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: 100%;
      max-width: 220px;
      margin-top: 10px;
    }

    .btn {
      padding: 12px;
      border: none;
      border-radius: 30px;
      font-weight: 900;
      font-size: 0.95rem;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 1px;
      transition: transform 0.1s, opacity 0.2s;
    }

    .btn:active {
      transform: scale(0.96);
    }

    .btn-higher {
      background-color: var(--lb-green);
      color: #000;
    }

    .btn-lower {
      background-color: var(--lb-orange);
      color: #000;
    }

    /* Écran de Game Over */
    .game-over-screen {
      position: absolute;
      inset: 0;
      background: rgba(20,24,28,0.96);
      z-index: 20;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      text-align: center;
    }

    .game-over-screen h2 {
      font-size: 2.2rem;
      color: #ff4757;
      margin-bottom: 10px;
    }

    .final-score {
      font-size: 1.2rem;
      margin-bottom: 25px;
      color: #9ab;
    }

    .final-score b {
      color: #fff;
      font-size: 1.8rem;
    }

    .btn-restart {
      background: var(--lb-blue);
      color: #000;
      padding: 14px 28px;
    }
  </style>
</head>
<body>

  <div class="game-container">
    <div class="header">
      <span>Letterboxd Higher/Lower</span>
      <span class="streak-badge">Série : <span id="score">0</span></span>
    </div>

    <div class="card" id="card-top">
      <div class="overlay"></div>
      <div class="card-content">
        <div class="title" id="title-top">Film A</div>
        <div class="year" id="year-top">2020</div>
        <div class="rating-box">
          ★ <span id="rating-top">4.2</span>
        </div>
      </div>
    </div>

    <div class="vs-divider">VS</div>

    <div class="card" id="card-bottom">
      <div class="overlay"></div>
      <div class="card-content">
        <div class="title" id="title-bottom">Film B</div>
        <div class="year" id="year-bottom">2022</div>
        
        <div class="actions" id="actions">
          <button class="btn btn-higher" onclick="makeGuess('higher')">▲ PLUS HAUT</button>
          <button class="btn btn-lower" onclick="makeGuess('lower')">▼ PLUS BAS</button>
        </div>

        <div class="rating-box" id="rating-bottom-box" style="display: none;">
          ★ <span id="rating-bottom">?.?</span>
        </div>
      </div>
    </div>

    <div class="game-over-screen" id="gameOverScreen">
      <h2>PERDU !</h2>
      <p class="final-score">Score final : <br><b id="finalScoreText">0</b></p>
      <button class="btn btn-restart" onclick="restartGame()">Rejouer</button>
    </div>
  </div>

  <script>
    // Base de données type Letterboxd (notes moyennes indicatives)
    const moviesDB = [
      { title: "Parasite", year: 2019, rating: 4.5, img: "https://images.unsplash.com/photo-1536440136628-849c177e76a1?w=800&auto=format&fit=crop" },
      { title: "Interstellar", year: 2014, rating: 4.4, img: "https://images.unsplash.com/photo-1451187580459-43490279c0fa?w=800&auto=format&fit=crop" },
      { title: "Spider-Man: Across the Spider-Verse", year: 2023, rating: 4.4, img: "https://images.unsplash.com/photo-1635805737707-575885ab0820?w=800&auto=format&fit=crop" },
      { title: "La La Land", year: 2016, rating: 4.1, img: "https://images.unsplash.com/photo-1518709268805-4e9042af9f23?w=800&auto=format&fit=crop" },
      { title: "Fight Club", year: 1999, rating: 4.3, img: "https://images.unsplash.com/photo-1509198397868-475647b2a1e5?w=800&auto=format&fit=crop" },
      { title: "Barbie", year: 2023, rating: 3.8, img: "https://images.unsplash.com/photo-1596461404969-9ae70f2830c1?w=800&auto=format&fit=crop" },
      { title: "Oppenheimer", year: 2023, rating: 4.2, img: "https://images.unsplash.com/photo-1446776811953-b23d57bd21aa?w=800&auto=format&fit=crop" },
      { title: "Avengers: Endgame", year: 2019, rating: 3.9, img: "https://images.unsplash.com/photo-1607604276583-eef5d076aa5f?w=800&auto=format&fit=crop" },
      { title: "Twilight", year: 2008, rating: 2.7, img: "https://images.unsplash.com/photo-1509281373149-e957c6296406?w=800&auto=format&fit=crop" },
      { title: "Whiplash", year: 2014, rating: 4.4, img: "https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=800&auto=format&fit=crop" },
      { title: "Joker", year: 2019, rating: 3.8, img: "https://images.unsplash.com/photo-1509347528160-9a9e33742cdb?w=800&auto=format&fit=crop" },
      { title: "Everything Everywhere All at Once", year: 2022, rating: 4.3, img: "https://images.unsplash.com/photo-1518709268805-4e9042af9f23?w=800&auto=format&fit=crop" }
    ];

    let currentScore = 0;
    let movieTop = null;
    let movieBottom = null;
    let availableMovies = [];

    function initGame() {
      availableMovies = [...moviesDB].sort(() => Math.random() - 0.5);
      movieTop = availableMovies.pop();
      movieBottom = availableMovies.pop();
      currentScore = 0;
      updateUI();
    }

    function updateUI() {
      document.getElementById('score').innerText
